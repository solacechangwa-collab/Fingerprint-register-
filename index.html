
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fingerprint Attendance Register</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
      color: #123b70;
      font-size: 24px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      background: #123b70;
      color: white;
      border: none;
      border-radius: 6px;
    }

    #message, #fingerprintStatus {
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Electronic Attendance Register</h1>

    <h3>Register Student</h3>
    <input id="studentName" placeholder="Enter student's full name">
    <input id="studentNumber" placeholder="Enter student number">
    <button id="registerBtn">Register Student</button>

    <h3>Biometric Fingerprint Attendance</h3>
    <p>First register the student, then connect their
       biometric credential through the secure server.</p>
    <button id="fingerprintBtn">Verify with Fingerprint</button>
    <p id="fingerprintStatus" role="status">Ready to begin.</p>

    <h3>Mark Attendance</h3>
    <input id="attendanceNumber" placeholder="Enter student number">
    <button id="attendanceBtn">Mark Attendance</button>

    <h3>Attendance Records</h3>
    <div id="records"></div>
    <p id="message" role="status"></p>
  </div>

  <script>
    function getStudents() {
      return JSON.parse(localStorage.getItem("students") || "{}");
    }

    function registerStudent() {
      const name = document.getElementById("studentName").value.trim();
      const number = document.getElementById("studentNumber").value.trim();

      if (!name || !number) {
        alert("Enter the student's name and number.");
        return;
      }

      const students = getStudents();

      if (students[number]) {
        alert("This student number is already registered.");
        return;
      }

      students[number] = { name, number };
      localStorage.setItem("students", JSON.stringify(students));

      document.getElementById("message").textContent =
        "Student registered successfully.";

      document.getElementById("studentName").value = "";
      document.getElementById("studentNumber").value = "";
      showRecords();
    }

    function markAttendance() {
      const number =
        document.getElementById("attendanceNumber").value.trim();
      const students = getStudents();

      if (!students[number]) {
        alert("Student not found. Register first.");
        return;
      }

      const attendance = JSON.parse(
        localStorage.getItem("attendance") || "[]"
      );

      const now = new Date();
      const date = now.toLocaleDateString();

      if (attendance.some(r => r.number === number && r.date === date)) {
        alert("Attendance has already been recorded today.");
        return;
      }

      attendance.push({
        name: students[number].name,
        number,
        date,
        time: now.toLocaleTimeString(),
        status: "Present"
      });

      localStorage.setItem("attendance", JSON.stringify(attendance));
      document.getElementById("message").textContent =
        "Demo attendance recorded. Fingerprint verification is not connected.";

      document.getElementById("attendanceNumber").value = "";
      showRecords();
    }

    async function verifyFingerprint() {
      const status = document.getElementById("fingerprintStatus");

      if (!window.isSecureContext) {
        status.textContent =
          "This page is not in a secure context. Open it through HTTPS or localhost.";
        return;
      }

      if (!window.PublicKeyCredential ||
          !navigator.credentials) {
        status.textContent =
          "WebAuthn is unavailable in this browser or environment.";
        return;
      }

      status.textContent =
        "Browser support detected. Biometric registration and verification still need a compatible server. No fingerprint has been registered.";
    }

    function showRecords() {
      const attendance = JSON.parse(
        localStorage.getItem("attendance") || "[]"
      );
      const output = document.getElementById("records");

      output.replaceChildren();

      if (attendance.length === 0) {
        output.textContent = "No attendance records yet.";
        return;
      }

      attendance.forEach(record => {
        const item = document.createElement("p");
        item.textContent =
          record.name + " (" + record.number + ") — " +
          record.date + ", " + record.time + " — " + record.status;
        output.appendChild(item);
      });
    }

    document.getElementById("registerBtn")
      .addEventListener("click", registerStudent);

    document.getElementById("attendanceBtn")
      .addEventListener("click", markAttendance);

    document.getElementById("fingerprintBtn")
      .addEventListener("click", verifyFingerprint);

    showRecords();
  </script>
</body>
</html>
